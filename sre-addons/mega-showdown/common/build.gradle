architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    enableTransitiveAccessWideners.set(true)
    accessWidenerPath.set(file("src/main/resources/mega_showdown.accesswidener"))
}

File generatedResources = file("src/generated")

sourceSets {
    main {
        resources.srcDir(generatedResources)
    }
}

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    modCompileOnly "net.fabricmc:fabric-language-kotlin:$project.kotlin_fabric_version"

    modCompileOnly "io.wispforest:accessories-common:${project.accessories_version}"

    modCompileOnly "maven.modrinth:jade:${project.jade_version_fabric}"
}
