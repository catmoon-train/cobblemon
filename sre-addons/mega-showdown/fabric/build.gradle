plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Cobblemon normally exposes this through Maven metadata; the local named API has no POM.
    // Runtime GraalVM is already nested in the production Cobblemon Fabric jar.
    compileOnly 'org.graalvm.sdk:graal-sdk:22.3.0'
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$project.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "net.fabricmc:fabric-language-kotlin:$project.kotlin_fabric_version"

    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"

    modImplementation "maven.modrinth:jade:${project.jade_version_fabric}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        // Preserve JSON escape sequences during version expansion.
        expand([version: project.version]) { escapeBackslash = true }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

